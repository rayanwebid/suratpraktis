name: Deploy to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      WORKER_NAME: ${{ vars.WORKER_NAME || 'suratpraktis' }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'suratpraktis-db' }}
      OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm deploy:prepare
      - run: pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/wrangler.deploy.json
      - run: pnpm exec wrangler deploy --config dist/server/wrangler.deploy.json
